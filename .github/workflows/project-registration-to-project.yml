name: Sync framework progress to GitHub Project

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to sync to the project'
        required: true

permissions:
  contents: read
  issues: write

jobs:
  assign-issue-author:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[Open Source Accessibility Framework]') }}
    steps:
      - name: Assign issue author
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let issue;
            if (context.eventName === 'workflow_dispatch') {
              const issueNumber = Number(context.payload.inputs?.issue_number);
              if (!Number.isInteger(issueNumber) || issueNumber < 1) {
                core.setFailed('Issue number must be a positive integer.');
                return;
              }
              const response = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              issue = response.data;
            } else {
              issue = context.payload.issue;
            }

            const issueAuthor = issue.user?.login?.trim();
            if (!issueAuthor) {
              core.setFailed(`Unable to determine who opened issue #${issue.number}.`);
              return;
            }

            const currentAssignees = new Set(
              (issue.assignees || []).map(assignee => assignee.login.toLowerCase())
            );
            if (currentAssignees.has(issueAuthor.toLowerCase())) {
              core.info(`@${issueAuthor} is already assigned to issue #${issue.number}.`);
              return;
            }

            const assignment = await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: [issueAuthor]
            });
            const assignedLogins = new Set(
              (assignment.data.assignees || []).map(assignee => assignee.login.toLowerCase())
            );

            if (!assignedLogins.has(issueAuthor.toLowerCase())) {
              core.setFailed(`Unable to assign @${issueAuthor} to issue #${issue.number}.`);
              return;
            }

            core.info(`Assigned @${issueAuthor} to issue #${issue.number}.`);

  sync-project-fields:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[Open Source Accessibility Framework]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Map issue form answers to project fields
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            let issue;
            if (context.eventName === 'workflow_dispatch') {
              const issueNumber = Number(context.payload.inputs?.issue_number);
              if (!Number.isInteger(issueNumber) || issueNumber < 1) {
                core.setFailed('Issue number must be a positive integer.');
                return;
              }
              const repo = context.repo.repo;
              const owner = context.repo.owner;
              const response = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              issue = response.data;
            } else {
              issue = context.payload.issue;
            }

            const body = issue.body || '';

            const fieldMap = {
              'Project name': 'project-name',
              'Repository URL': 'project-repository',
              'Project URL': 'project-url',
              'Maintainer / contributor POC': 'point-of-contact',
              'Maintainer POC': 'point-of-contact',
              'Foundational Phase': 'foundational-phase',
              'Workflow Phase': 'workflow-phase',
              'Testing Phase': 'testing-phase',
              'Community Phase': 'community-phase'
            };

            function parseMarkdownField(bodyText, label) {
              const escapedLabel = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = bodyText.match(
                new RegExp(
                  `^###[ \\t]+${escapedLabel}[ \\t]*\\r?\\n([\\s\\S]*?)(?=^###[ \\t]+|(?![\\s\\S]))`,
                  'im'
                )
              );
              if (!match) return '';
              return match[1].trim().replace(/^\s*[-*]\s*/, '').replace(/\n+/g, ' ').replace(/\s+/g, ' ').trim();
            }

            const issueAuthor = issue.user?.login?.trim();
            if (!issueAuthor || !/^[a-z\d](?:[a-z\d-]{0,37}[a-z\d])?$/i.test(issueAuthor)) {
              core.setFailed(`Unable to determine a valid GitHub username for the author of issue #${issue.number}.`);
              return;
            }

            const {
              buildPointOfContactValue,
              calculatePhasePercentages,
              ensureProgressSection
            } = require('./.github/scripts/registration-progress.cjs');
            const pointOfContactLabels = [
              'Maintainer(s) / contributor(s) point of contact',
              'Maintainer / contributor point of contact',
              'Maintainer point of contact'
            ];
            const listedPointsOfContact = pointOfContactLabels
              .map(label => parseMarkdownField(body, label))
              .find(value => value) || '';
            let pointOfContact;
            let phasePercentages;
            try {
              pointOfContact = buildPointOfContactValue(
                issueAuthor,
                listedPointsOfContact
              );
              phasePercentages = calculatePhasePercentages(
                ensureProgressSection(body).body
              );
            } catch (error) {
              core.setFailed(`Unable to map tracking issue fields: ${error.message}`);
              return;
            }

            const values = {
              'project-name': parseMarkdownField(body, 'Project name'),
              'project-repository': parseMarkdownField(body, 'Project repository'),
              'project-url': parseMarkdownField(body, 'Project URL'),
              'point-of-contact': pointOfContact,
              ...phasePercentages
            };

            const projectOwner = 'open-source-accessibility';
            const projectNumber = 1;

            const projectData = await github.graphql(`
              query($owner: String!, $number: Int!) {
                organization(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 100) {
                      nodes {
                        __typename
                        ... on ProjectV2FieldCommon {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            `, { owner: projectOwner, number: projectNumber });

            const project = projectData.organization?.projectV2;
            if (!project) {
              core.setFailed(`Project ${projectOwner}/${projectNumber} was not found.`);
              return;
            }

            const fieldIds = Object.fromEntries(
              (project.fields.nodes || [])
                .filter(field => field.__typename !== 'ProjectV2RepositoryField')
                .map(field => [field.name, field.id])
            );
            const requiredPhaseFields = [
              'Foundational Phase',
              'Workflow Phase',
              'Testing Phase',
              'Community Phase'
            ];
            const missingPhaseFields = requiredPhaseFields.filter(fieldName => !fieldIds[fieldName]);
            if (missingPhaseFields.length > 0) {
              core.setFailed(
                `The project is missing required phase fields: ${missingPhaseFields.join(', ')}.`
              );
              return;
            }

            const itemQuery = await github.graphql(`
              query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            id
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, { projectId: project.id });

            let itemId = (itemQuery.node?.items?.nodes || []).find(
              node => node.content && node.content.id === issue.node_id
            )?.id;

            if (!itemId) {
              const createResult = await github.graphql(`
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                    item {
                      id
                    }
                  }
                }
              `, {
                projectId: project.id,
                contentId: issue.node_id
              });

              itemId = createResult.addProjectV2ItemById.item.id;
            }

            const entries = Object.entries(fieldMap)
              .filter(([projectFieldName]) => fieldIds[projectFieldName])
              .map(([projectFieldName, issueKey]) => ({
                fieldId: fieldIds[projectFieldName],
                value: values[issueKey]
              }))
              .filter(entry => entry.value && entry.value.trim() !== '');

            for (const entry of entries) {
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: ProjectV2FieldValue!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId,
                    itemId: $itemId,
                    fieldId: $fieldId,
                    value: $value
                  }) {
                    projectV2Item {
                      id
                    }
                  }
                }
              `, {
                projectId: project.id,
                itemId,
                fieldId: entry.fieldId,
                value: { text: entry.value }
              });
            }

            core.info(`Synced issue #${issue.number} to project ${projectOwner}/${projectNumber}`);
