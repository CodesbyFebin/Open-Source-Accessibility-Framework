name: Set up framework progress tracking

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to comment on.'
        required: true
        default: '1'

permissions:
  issues: write
  contents: read

jobs:
  welcome-comment:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      ((github.event.action == 'opened' || github.event.action == 'reopened') &&
      startsWith(github.event.issue.title, '[Open Source Accessibility Framework]')) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get project name and build badge
        id: project
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let issue;
            if (context.eventName === 'workflow_dispatch') {
              const issueNumber = Number(context.payload.inputs?.issue_number || '1');
              const response = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              issue = response.data;
            } else {
              issue = context.payload.issue;
            }

            const body = issue.body || '';
            const issueAuthor = issue.user?.login;
            if (!issueAuthor) {
              core.setFailed(`Unable to determine who opened issue #${issue.number}.`);
              return;
            }

            function getFieldValue(label) {
              const match = body.match(new RegExp(`###\\s*${label}\\s*\\n+([\\s\\S]*?)(?=\\n###\\s*|\\n*$)`, 'i'));
              if (!match) return '';
              return match[1].trim().replace(/\r/g, '').replace(/\n+/g, ' ').trim();
            }

            const projectName = getFieldValue('Project name') || 'Project';
            const issueUrl = issue.html_url;
            const participationHeading = '### Accessibility framework participation';
            const participationMessage = [
              participationHeading,
              'This project participates in the [Open Source Accessibility Framework](https://open-source-accessibility.github.io/Open-Source-Accessibility-Framework/), demonstrating its commitment to ongoing accessibility improvement.',
              'This tracking issue documents the project’s progress as it adopts the framework and provides a public record of its accessibility commitments, completed work, and next steps.',
              'To follow the progress of other participating projects, visit the [Open Source Accessibility Framework project board](https://github.com/orgs/open-source-accessibility/projects/1).'
            ].join('\n\n');
            const { ensureProgressSection } =
              require('./.github/scripts/registration-progress.cjs');

            let updatedBody = body;
            if (!updatedBody.includes(participationHeading)) {
              updatedBody = `${participationMessage}\n\n---\n\n${updatedBody}`;
            }
            try {
              updatedBody = ensureProgressSection(updatedBody).body;
            } catch (error) {
              core.setFailed(`Unable to add framework progress: ${error.message}`);
              return;
            }

            if (updatedBody !== body) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: updatedBody
              });
            }

            const safeName = encodeURIComponent(projectName).replace(/%20/g, '%20');
            const badgeUrl = `https://img.shields.io/badge/Accessibility%20Framework-${safeName}-F143AB?logo=github&logoColor=000000`;

            core.setOutput('project_name', projectName);
            core.setOutput('issue_author', issueAuthor);
            core.setOutput('issue_url', issueUrl);
            core.setOutput('badge_url', badgeUrl);
            core.setOutput('badge_markdown', `[![OSAF: ${projectName}](${badgeUrl})](${issueUrl})`);

      - name: Comment on the tracking issue
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let issue;
            if (context.eventName === 'workflow_dispatch') {
              const issueNumber = Number(context.payload.inputs?.issue_number || '1');
              const response = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              issue = response.data;
            } else {
              issue = context.payload.issue;
            }

            const issueAuthor = '${{ steps.project.outputs.issue_author }}';
            const badgeMarkdown = '${{ steps.project.outputs.badge_markdown }}';

            const comment = [
              `@${issueAuthor}, your project is now tracking progress with the [Open Source Accessibility Framework](https://open-source-accessibility.github.io/Open-Source-Accessibility-Framework/). We're so happy you joined us.`,
              'This issue will be used to track your progress and public accountability commitments. Please feel free to add this badge in your project repo to let others know about your progress:',
              badgeMarkdown,
              [
                'Please refer to the phase documentation for next steps:',
                '* **[Foundational phase](https://open-source-accessibility.github.io/Open-Source-Accessibility-Framework/foundational):** make accessibility visible and create a clear reporting path',
                '* **[Workflow phase](https://open-source-accessibility.github.io/Open-Source-Accessibility-Framework/workflow):** integrate accessibility into issues, pull requests, and contribution practices',
                '* **[Testing phase](https://open-source-accessibility.github.io/Open-Source-Accessibility-Framework/testing):** add automated and manual testing practices',
                '* **[Community phase](https://open-source-accessibility.github.io/Open-Source-Accessibility-Framework/community):** improve responsiveness, documentation, and contributor participation'
              ].join('\n')
            ].join('\n\n').trim();

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: comment
            });

  sync-progress-recap:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'issues' && github.event.action == 'edited' &&
      startsWith(github.event.issue.title, '[Open Source Accessibility Framework]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update framework progress recap
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const issue = response.data;
            const {
              ensureProgressSection,
              updateRecap
            } = require('./.github/scripts/registration-progress.cjs');

            let result;
            try {
              const progress = ensureProgressSection(issue.body || '');
              result = updateRecap(progress.body);
            } catch (error) {
              core.setFailed(`Unable to update the framework progress recap: ${error.message}`);
              return;
            }

            if (result.body === (issue.body || '')) {
              core.info(`The framework progress recap for issue #${issue.number} is already current.`);
              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: result.body
            });

            core.info(`Updated the framework progress recap for issue #${issue.number}.`);